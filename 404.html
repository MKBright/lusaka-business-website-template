<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="description" content="This page is not on the site. Go back to the business home page.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4efe4;
      color: #1c1915;
      font-family: Inter, Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.5;
    }
    .stripe {
      height: 0.45rem;
      background-image: repeating-linear-gradient(
        90deg,
        #0f5132 0 14px,
        #e0a100 14px 22px,
        #f4efe4 22px 26px,
        #1c1915 26px 30px
      );
    }
    main {
      width: min(36rem, calc(100% - 2.2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }
    h1 {
      margin: 0 0 0.6rem;
      font-family: "Noto Serif", Georgia, serif;
      font-size: clamp(2.2rem, 10vw, 3.4rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 1rem; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 3rem;
      padding: 0.55rem 1rem;
      background: #0f5132;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible {
      outline: 3px solid #1c1915;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <main>
    <p>404</p>
    <h1>Page not found</h1>
    <p>That address is not on this site. The business home page has the prices, hours, map, and WhatsApp button.</p>
    <p><a id="home" href="./">Back to the site</a></p>
  </main>
  <script>
    (function () {
      var marker = "/lusaka-business-website-template/";
      var path = location.pathname;
      var index = path.indexOf(marker);
      if (index !== -1) {
        document.getElementById("home").href = path.slice(0, index + marker.length);
      }
    })();
  </script>
</body>
</html>
